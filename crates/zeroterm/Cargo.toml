[package]
name = "zeroterm"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "ZeroTerm - GPU-accelerated terminal emulator"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }
anyhow = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
portable-pty = { workspace = true }
pollster = "0.4"
arboard = "3.2"
zeroterm-core = { path = "../zeroterm-core" }
zeroterm-render = { path = "../zeroterm-render" }
zeroterm-mux = { path = "../zeroterm-mux" }
zeroterm-config = { path = "../zeroterm-config" }
zeroterm-ai = { path = "../zeroterm-ai" }
zeroterm-sync = { path = "../zeroterm-sync" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
notify = { version = "7", features = ["macos_kqueue"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
zeroterm-ssh = { path = "../zeroterm-ssh" }

[dev-dependencies]
criterion = { workspace = true }

# These lints fire only in main.rs (pane_cmd, HostPicker, keyboard handlers).
# main.rs has in-flight changes from another agent and must not be touched here;
# once it lands, these allows should be removed and the warnings fixed inline.
[lints.rust]
dead_code = "allow"

[lints.clippy]
same_item_push = "allow"
unnecessary_map_or = "allow"
clone_on_copy = "allow"
needless_range_loop = "allow"
for_kv_map = "allow"
single_match = "allow"
collapsible_match = "allow"