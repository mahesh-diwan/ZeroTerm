[package]
name = "zeroterm"
version = "0.3.6"
edition = "2021"
license = "MIT"
description = "ZeroTerm - GPU-accelerated terminal emulator"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "env-filter"] }
anyhow = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
portable-pty = { workspace = true }
pollster = "0.4"
arboard = "3.2"
zeroterm-core = { path = "../zeroterm-core" }
zeroterm-render = { path = "../zeroterm-render" }
zeroterm-mux = { path = "../zeroterm-mux" }
zeroterm-config = { path = "../zeroterm-config" }
zeroterm-ai = { path = "../zeroterm-ai", optional = true }
zeroterm-sync = { path = "../zeroterm-sync", optional = true }
zeroterm-plugin = { path = "../zeroterm-plugin", optional = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"], optional = true }
notify = { version = "7", features = ["macos_kqueue"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = ["gpu", "themes"]
gpu = []
themes = []
ai = ["dep:zeroterm-ai", "dep:tokio"]
sync = ["dep:zeroterm-sync"]
ssh = ["dep:zeroterm-ssh"]
plugins = ["dep:zeroterm-plugin"]

[target.'cfg(unix)'.dependencies]
zeroterm-ssh = { path = "../zeroterm-ssh", optional = true }

[dev-dependencies]
criterion = { workspace = true }

# These clippy lints still fire in main.rs (HostPicker push, keyboard handlers,
# copy_selection) and are allowed crate-wide until main.rs is touched to fix
# them inline. dead_code needs no crate-level allow: main.rs carries explicit
# #[allow(dead_code)] on App/impl App for the Windows cfg(unix) gap.
[lints.clippy]
same_item_push = "allow"
unnecessary_map_or = "allow"
clone_on_copy = "allow"
needless_range_loop = "allow"
for_kv_map = "allow"
single_match = "allow"
collapsible_match = "allow"