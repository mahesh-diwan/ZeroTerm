[package]
name = "zeroterm-config"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TOML parser, Lua runtime, and GUI settings for ZeroTerm"

[dependencies]
tokio = { workspace = true, features = ["full", "tracing"] }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
mlua = { workspace = true }
dirs = { workspace = true }
zeroterm-core = { path = "../zeroterm-core" }

[dev-dependencies]
criterion = { workspace = true }