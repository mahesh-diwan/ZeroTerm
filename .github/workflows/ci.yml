name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_exclude: ""
          - os: macos-latest
            cargo_exclude: ""
          - os: windows-latest
            # zeroterm-ssh is now Windows-portable (cfg(not(unix)) stub since
            # 13ea948; ssh2 is cfg(unix)-gated), so it stays in the workspace.
            # The zeroterm app binary still excludes itself here: main.rs is
            # cfg(unix)-gated but its native deps (mlua-sys, ring) can't be
            # verified from a non-Windows host, and the release pipeline must
            # prove `cargo build -p zeroterm` on a real runner first. Drop this
            # once the Windows app build is green.
            cargo_exclude: "--exclude zeroterm"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: [fmt, clippy]
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          # Retry the network-heavy fetch (crates.io is occasionally flaky from
          # runners); build offline so later steps never touch the network.
          for i in 1 2 3; do
            cargo fetch --locked && break
            if [ "$i" = "3" ]; then
              echo "::error::cargo fetch failed after 3 attempts"
              exit 1
            fi
            echo "::warning::cargo fetch attempt ${i}/3 failed; retrying in 10s"
            sleep 10
          done
          cargo build --locked --offline --workspace ${{ matrix.cargo_exclude }}
      - name: Test
        run: cargo test --locked --offline --workspace ${{ matrix.cargo_exclude }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --offline --workspace --all-targets ${{ matrix.cargo_exclude }} -- -D warnings
