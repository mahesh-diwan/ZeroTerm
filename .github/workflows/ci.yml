name: CI

# List form (proven to work) — the block form with null values below `on:`
# made GitHub reject the workflow silently (runs created with 0 jobs).
on: [push, pull_request]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cargo_exclude: ""
          - os: macos-latest
            cargo_exclude: ""
          - os: windows-latest
            # zeroterm-ssh is Windows-portable (cfg(not(unix)) stub since
            # 13ea948; ssh2 is cfg(unix)-gated), so it stays in the workspace.
            # The zeroterm app is excluded here for speed only: the release
            # pipeline proves `cargo build -p zeroterm` on a real Windows
            # runner (green since mlua became vendored, 2026-08-07). Keeping
            # the workspace leg lean avoids re-compiling the app (wgpu/winit)
            # twice on Windows.
            cargo_exclude: "--exclude zeroterm"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Transient crates.io failures are the #1 CI flake source; make cargo retry
    # individual requests (10x, 120s timeout) so a single dropped connection
    # never fails the whole pipeline.
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 120
    steps:
      - uses: actions/checkout@v4
      # components must be a single comma-separated string (a YAML list or
      # space-separated value makes the step fail on every platform).
      # Note: `fmt` (rustfmt) is no longer distributed as a rustup component
      # for stable, so only clippy is requested here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl-dev libssl-dev pkg-config
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config
      - name: Build
        # The retry loop below is bash; Windows run: steps default to
        # PowerShell, so force bash on every platform.
        shell: bash
        run: |
          # Retry the network-heavy fetch (crates.io is occasionally flaky from
          # runners); build offline so later steps never touch the network.
          # Note: run: steps execute with set -e, so the retry loop must turn
          # it off or the first failed fetch would abort the whole step.
          set +e
          for i in 1 2 3 4 5; do
            cargo fetch --locked
            status=$?
            if [ "$status" -eq 0 ]; then break; fi
            echo "::warning::cargo fetch attempt ${i}/5 failed (exit ${status}); retrying in 10s"
            sleep 10
          done
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo fetch failed after 5 attempts"
            exit 1
          fi
          cargo build --locked --offline --workspace ${{ matrix.cargo_exclude }}
      - name: Test
        run: cargo test --locked --offline --workspace ${{ matrix.cargo_exclude }}
      # rustfmt is no longer shipped as a stable rustup component, so there is
      # no fmt gate in CI. Run `cargo fmt` locally before committing.
      - name: Clippy
        run: cargo clippy --locked --offline --workspace --all-targets ${{ matrix.cargo_exclude }} -- -D warnings
