name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          # windows-latest is handled by the separate `windows` job below, so a
          # first-time Windows build can't block the linux/macos release.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl-dev libssl-dev pkg-config
      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake pkg-config
      - name: Build release
        run: |
          # crates.io downloads on runners can be transiently flaky; retry the
          # network-heavy fetch, then build offline so the build itself never
          # depends on the network. (run: steps use set -e, so the loop must
          # turn it off or the first failed fetch aborts the step.)
          set +e
          for i in 1 2 3; do
            cargo fetch --locked
            status=$?
            if [ "$status" -eq 0 ]; then break; fi
            echo "::warning::cargo fetch attempt ${i}/3 failed (exit ${status}); retrying in 10s"
            sleep 10
          done
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo fetch failed after 3 attempts"
            exit 1
          fi
          cargo build --release --locked --offline -p zeroterm
      - name: Check binary size (50MB gate)
        if: matrix.os == 'ubuntu-latest'
        run: |
          SIZE=$(stat -c%s target/release/zeroterm)
          echo "Binary size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -ge $((50 * 1024 * 1024)) ]; then
            echo "::error::zeroterm is ${SIZE} bytes, exceeds the 50MB gate"
            exit 1
          fi
      - name: Package for Linux (AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/make_appimage.sh
      - name: Package for macOS (.app bundle)
        if: matrix.os == 'macos-latest'
        run: bash scripts/make_macos_app.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm-${{ matrix.target }}-packages
          path: |
            target/release/zeroterm${{ matrix.suffix }}
            dist/*
          if-no-files-found: ignore

  # Windows build is separate from the build matrix so it cannot block the
  # linux/macos release: the app's native deps (mlua-sys, ring) were never
  # verified on a real Windows host. This job proves `cargo build -p zeroterm`
  # on a Windows runner and ships the zip; the MSI stays optional (WiX isn't
  # installed on the runner, and scripts/windows_installer.wxs still needs a
  # real UpgradeCode before it can ship).
  windows:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    # The Windows app stack (mlua-sys, ring, portable-pty) has never been
    # verified on a real Windows host, so a Windows failure must not block
    # publishing the Linux/macOS release. If it ever passes, its zip ships too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        shell: bash
        run: |
          # run: steps execute with set -e, so a plain `cargo fetch && break`
          # would abort the step on the first failed fetch. Turn set -e off
          # inside the retry loop (same pattern as the build matrix job).
          set +e
          for i in 1 2 3; do
            cargo fetch --locked
            status=$?
            if [ "$status" -eq 0 ]; then break; fi
            echo "::warning::cargo fetch attempt ${i}/3 failed (exit ${status}); retrying in 10s"
            sleep 10
          done
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo fetch failed after 3 attempts"
            exit 1
          fi
          cargo build --release --locked --offline -p zeroterm
      - name: Package for Windows (zip)
        run: scripts\package_windows.bat
        shell: cmd
        env:
          VERSION: ${{ github.ref_name }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm-windows
          path: |
            target/release/zeroterm.exe
            dist/*
          if-no-files-found: ignore

  flatpak:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    # Heavy external SDK downloads can be flaky; don't let that block releases.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install -y --noninteractive org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak
        run: flatpak-builder --repo=repo --force-clean build-dir scripts/io.github.zeroterm.ZeroTerm.yml
      - name: Bundle Flatpak
        run: flatpak build-bundle repo zeroterm.flatpak io.github.zeroterm.ZeroTerm
      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.flatpak
          path: zeroterm.flatpak

  deb:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl-dev libssl-dev pkg-config
      - name: Build .deb package
        run: |
          set +e
          for i in 1 2 3; do
            cargo fetch --locked
            status=$?
            if [ "$status" -eq 0 ]; then break; fi
            echo "::warning::cargo fetch attempt ${i}/3 failed (exit ${status}); retrying in 10s"
            sleep 10
          done
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo fetch failed after 3 attempts"
            exit 1
          fi
          cargo build --release --locked --offline
          bash scripts/build-deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.deb
          path: zeroterm_*.deb

  rpm:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install rpm tools and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl-dev libssl-dev pkg-config
      - name: Build .rpm package
        run: |
          set +e
          for i in 1 2 3; do
            cargo fetch --locked
            status=$?
            if [ "$status" -eq 0 ]; then break; fi
            echo "::warning::cargo fetch attempt ${i}/3 failed (exit ${status}); retrying in 10s"
            sleep 10
          done
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo fetch failed after 3 attempts"
            exit 1
          fi
          cargo build --release --locked --offline
          bash scripts/build-rpm.sh
      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.rpm
          path: "*.rpm"

  systemd-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Upload systemd unit
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.service
          path: scripts/zeroterm.service

  # Publishes the GitHub Release itself. Everything above only uploads build
  # artifacts to the run; this job assembles them into a tagged Release so
  # install.sh and the landing page can point at `releases/latest/download/...`.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, windows, deb, rpm, flatpak, systemd-unit]
    # Only publish when the primary Linux/macOS build succeeded; optional jobs
    # (windows/flatpak) failing must not block the release, and a failed main
    # build must not publish an empty release.
    if: always() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Show collected assets
        run: find release-assets -type f | sort
      - name: Remove stale release for this tag
        run: gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
