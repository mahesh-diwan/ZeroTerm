name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release -p zeroterm
      - name: Check binary size (50MB gate)
        if: matrix.os == 'ubuntu-latest'
        run: |
          SIZE=$(stat -c%s target/release/zeroterm)
          echo "Binary size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -ge $((50 * 1024 * 1024)) ]; then
            echo "::error::zeroterm is ${SIZE} bytes, exceeds the 50MB gate"
            exit 1
          fi
      - name: Package for Linux (AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/make_appimage.sh
      - name: Package for macOS (.app bundle)
        if: matrix.os == 'macos-latest'
        run: bash scripts/make_macos_app.sh
      - name: Package for Windows (zip + MSI)
        if: matrix.os == 'windows-latest'
        run: .\scripts\package_windows.bat
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm-${{ matrix.target }}-packages
          path: |
            target/release/zeroterm${{ matrix.suffix }}
            dist/*
          if-no-files-found: ignore

  flatpak:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install -y --noninteractive org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak
        run: flatpak-builder --repo=repo --force-clean build-dir scripts/io.github.zeroterm.ZeroTerm.yml
      - name: Bundle Flatpak
        run: flatpak build-bundle repo zeroterm.flatpak io.github.zeroterm.ZeroTerm
      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.flatpak
          path: zeroterm.flatpak

  deb:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build .deb package
        run: bash scripts/build-deb.sh
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.deb
          path: zeroterm_*.deb

  rpm:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install rpm tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build .rpm package
        run: bash scripts/build-rpm.sh
      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.rpm
          path: "*.rpm"

  systemd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload systemd unit
        uses: actions/upload-artifact@v4
        with:
          name: zeroterm.service
          path: scripts/zeroterm.service
